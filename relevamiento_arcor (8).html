<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Relevamiento Freezers - Arcor</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f5f7;min-height:100vh}
#app{display:flex;justify-content:center;padding:0 0 60px}
.card{background:#fff;border-radius:0 0 16px 16px;width:100%;max-width:560px;box-shadow:0 4px 32px rgba(0,0,0,.10)}
.header{background:#003087;padding:20px 20px 16px}
.logo{background:#E31837;color:#fff;font-weight:900;font-size:14px;letter-spacing:2px;padding:5px 11px;border-radius:6px;display:inline-block;margin-bottom:10px}
.titulo{color:#fff;font-weight:700;font-size:18px}.subtitulo{color:rgba(255,255,255,.6);font-size:13px;margin-top:2px}
.progreso{display:flex;margin-top:16px;gap:2px}
.p-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.p-circulo{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);color:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.p-circulo.activo{background:#E31837;color:#fff;box-shadow:0 0 0 3px rgba(227,24,55,.35)}
.p-circulo.completo{background:#1a7f4b;color:#fff}
.p-label{color:rgba(255,255,255,.45);font-size:9px;font-weight:600;text-align:center}
.p-label.activo{color:#fff}
.body{padding:24px 20px 8px}.bloque{min-height:260px}
.ptitulo{font-size:19px;font-weight:700;color:#003087;margin-bottom:5px}
.hint{font-size:13px;color:#6b7280;margin-bottom:14px}
select,input[type=text]{width:100%;padding:12px 14px;border:1.5px solid #d0d5de;border-radius:10px;font-size:15px;outline:none;background:#fafbfc;color:#111;appearance:none;-webkit-appearance:none;font-family:inherit}
.input-wrap{position:relative}
.input-check{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#1a7f4b;font-weight:700;font-size:18px;pointer-events:none}
.dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid #d0d5de;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;max-height:260px;overflow-y:auto}
.dd-item{padding:13px 14px;cursor:pointer;border-bottom:1px solid #f4f5f7;font-weight:700;font-size:15px;font-family:monospace;letter-spacing:1px;color:#111}
.dd-item:active{background:#eff6ff}
.dd-vacio{padding:14px;text-align:center;color:#9ca3af;font-size:14px}
.seleccionado{margin-top:10px;padding:12px 14px;background:#f0faf4;border:1.5px solid #1a7f4b;border-radius:10px}
.sel-codigo{font-size:11px;font-weight:700;color:#1a7f4b;letter-spacing:1px;margin-bottom:3px}
.sel-nombre{font-weight:700;font-size:15px;color:#111}.sel-sub{font-size:13px;color:#6b7280;margin-top:2px}
.cant-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.cant-num{font-size:48px;font-weight:900;color:#003087;min-width:70px;text-align:center;line-height:1}
.btn-cant{width:48px;height:48px;border-radius:50%;border:2px solid #003087;background:#fff;color:#003087;font-size:24px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-cant:disabled{opacity:.25;pointer-events:none}
.cant-label{font-size:13px;color:#003087;font-weight:600}
.o-sep{display:flex;align-items:center;gap:10px;margin:18px 0}
.o-linea{flex:1;height:1px;background:#d0d5de}.o-txt{font-size:12px;color:#9ca3af;font-weight:600}
.btn-sin{width:100%;padding:20px 16px;border:2px dashed #d0d5de;border-radius:12px;background:#fafbfc;color:#6b7280;font-size:16px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.btn-sin.activo{border:2px solid #1a7f4b;background:#f0faf4;color:#1a7f4b;font-weight:700}
.info-box{margin-top:12px;padding:10px 14px;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:10px;font-size:13px;color:#1d4ed8;font-weight:500}
.tipo-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px solid #d0d5de;border-radius:10px;margin-bottom:8px;background:#fafbfc}
.tipo-row.activo{border-color:#003087;background:#eff6ff}
.tipo-nombre{font-size:14px;font-weight:600;color:#111;flex:1}
.tipo-ctrl{display:flex;align-items:center;gap:12px}
.btn-tipo{width:34px;height:34px;border-radius:50%;border:2px solid #003087;background:#fff;color:#003087;font-size:18px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center}
.btn-tipo:disabled{opacity:.25}
.tipo-cant{font-size:20px;font-weight:800;min-width:24px;text-align:center;color:#9ca3af}
.tipo-cant.activo{color:#003087}
.badge-asignar{text-align:center;padding:8px;font-weight:700;font-size:14px;margin-bottom:10px}
.serie-header{font-size:12px;font-weight:700;color:#003087;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid rgba(0,48,135,.15)}
.serie-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.serie-lbl{min-width:32px;font-weight:700;font-size:13px;color:#6b7280}
.serie-input{flex:1;font-family:monospace;letter-spacing:1px}
.serie-input.ok{border-color:#1a7f4b;background:#f0faf4}
.resumen-card{border:1.5px solid #d0d5de;border-radius:12px;overflow:hidden;margin-bottom:20px}
.r-fila{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 14px;border-bottom:1px solid #f4f5f7;gap:12px}
.r-label{font-size:12px;color:#6b7280;font-weight:600;min-width:130px;flex-shrink:0}
.r-valor{font-size:13px;color:#111;font-weight:600;text-align:right}
.r-valor.mono{font-family:monospace;letter-spacing:1px}
.nav{display:flex;justify-content:space-between;padding:14px 20px 24px;border-top:1px solid #f4f5f7;margin-top:8px;gap:10px}
.btn-primary{background:#003087;color:#fff;border:none;border-radius:10px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;margin-left:auto;font-family:inherit}
.btn-primary:disabled{background:#c5cdd8;cursor:not-allowed}
.btn-secondary{background:transparent;color:#003087;border:1.5px solid #003087;border-radius:10px;padding:13px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-enviar{width:100%;background:#E31837;color:#fff;border:none;border-radius:10px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.5px;font-family:inherit}
.exito{text-align:center;padding:32px 20px}
.exito-icon{width:68px;height:68px;border-radius:50%;background:#1a7f4b;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:700}
.exito-titulo{font-size:22px;font-weight:700;color:#003087;margin-bottom:20px}
.loading{text-align:center;padding:40px 20px;color:#6b7280;font-size:15px}
.spinner{width:36px;height:36px;border:3px solid #d0d5de;border-top-color:#003087;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{padding:12px 14px;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;font-size:13px;color:#991b1b;margin-bottom:12px}</style>
</head>

const DISTRIBUIDORAS=["ALIMENTICIA HERNANDO S.A.", "CANNA MELIS S.R.L.", "CARLOS M. BORSELLI SRL", "CORDOBA NORTE CANAL EXCLUSIVO S.A.", "DANOM S.A.", "DEL CENTRO S.R.L.", "DISPLAY S.R.L.", "DISTRIGAL S.R.L.", "FANS S.A.", "FORZATER S.R.L.", "GONZALEZ GARCIA S.A.", "GOOD SWEETS S.A.", "GRUPO CUSSINO SAS", "JOSE IGNACIO PAROLA S.R.L.", "JUAN JOSE FORMENTO S.R.L.", "LOGISTICA HERRGOTT S.A.", "LOGISTICA ZONA SUR S.A.", "MARIO CHIALVO Y CIA S.R.L.", "NEXO DE SABRINA V. FERNANDEZ E HIJOS S.A", "RAUL WALTER GOMEZ S.A.S.", "RIM S.A.", "SUKKAR S.R.L.", "TL COMERCIALIZADORA S.R.L."];
const TIPOS_ARCOR=["Freezer Vertical", "Freezer 3 canastos", "Freezer 4 canastos", "Freezer 5 canastos", "Freezer 6 canastos"];

const PASO={DIST:1,PDV:2,FREEZER:3,TIPOS:4,SERIES:5,RESUMEN:6,ENVIANDO:7,EXITO:8};
let st={paso:PASO.DIST,distribuidora:"",pdv:null,pdvQuery:"",cantArcor:0,sinFreezer:false,cantPorTipo:{},seriesPorTipo:{},dropdownVisible:false,error:""};

function pdvsDeDistribuidor(){return st.distribuidora?(PDV_MAP[st.distribuidora]||[]):[]; }
function resultadosBusqueda(){if(st.pdvQuery.length<3)return[];var q=st.pdvQuery.replace(/\s/g,"");return pdvsDeDistribuidor().filter(function(p){return p.includes(q);}).slice(0,10);}
function sumaActual(){return Object.values(st.cantPorTipo).reduce(function(a,b){return a+b;},0);}
function seriesFlat(){var rows=[];TIPOS_ARCOR.forEach(function(tipo){var n=st.cantPorTipo[tipo]||0;for(var i=0;i<n;i++)rows.push({tipo:tipo,idx:i,val:(st.seriesPorTipo[tipo]||[])[i]||""});});return rows;}
function tiposUsados(){return TIPOS_ARCOR.filter(function(t){return (st.cantPorTipo[t]||0)>0;});}

function canSiguiente(){
  if(st.paso===PASO.DIST)return st.distribuidora!=="";
  if(st.paso===PASO.PDV)return st.pdv!==null;
  if(st.paso===PASO.FREEZER)return st.cantArcor>0||st.sinFreezer;
  if(st.paso===PASO.TIPOS)return sumaActual()===st.cantArcor;
  if(st.paso===PASO.SERIES)return seriesFlat().every(function(r){return r.val.trim().length>=3;});
  return false;
}
function avanzar(){if(st.paso===PASO.FREEZER&&st.cantArcor===0){st.paso=PASO.RESUMEN;render();return;}st.paso++;render();}
function retroceder(){if(st.paso===PASO.RESUMEN&&st.cantArcor===0){st.paso=PASO.FREEZER;render();return;}st.paso--;render();}

async function enviar(){
  st.paso=PASO.ENVIANDO;render();
  var fecha=new Date().toLocaleString("es-AR");
  var sf=seriesFlat();
  var payload={fecha:fecha,distribuidora:st.distribuidora,pdv:st.pdv,cant_arcor:st.cantArcor,sin_freezer_arcor:st.sinFreezer?"SI":"NO"};
  TIPOS_ARCOR.forEach(function(t){payload["cant_"+t]=st.cantPorTipo[t]||0;});
  sf.forEach(function(r,i){payload["serie_"+(i+1)]=r.val;payload["tipo_serie_"+(i+1)]=r.tipo;});
  try{
    await fetch(WEBHOOK_URL,{method:"POST",body:JSON.stringify(payload),mode:"no-cors"});
    st.paso=PASO.EXITO;render();
  }catch(e){
    st.error="Error de conexion. Verifica el WiFi e intenta de nuevo.";
    st.paso=PASO.RESUMEN;render();
  }
}

function resetear(){st={paso:PASO.DIST,distribuidora:"",pdv:null,pdvQuery:"",cantArcor:0,sinFreezer:false,cantPorTipo:{},seriesPorTipo:{},dropdownVisible:false,error:""};render();}

function buildProgreso(){
  var labels=["Distrib.","PDV","Freezers"];
  if(st.cantArcor>0){labels.push("Tipos");labels.push("N Serie");}
  labels.push("Resumen");
  var idx;
  if(st.cantArcor===0){idx=st.paso<=PASO.FREEZER?st.paso-1:st.paso-3;}
  else{idx=st.paso-1;}
  return labels.map(function(l,i){
    var cls=i<idx?"completo":i===idx?"activo":"";
    var num=i<idx?"&#10003;":(i+1);
    return '<div class="p-item"><div class="p-circulo '+cls+'">'+num+'</div><div class="p-label '+cls+'">'+l+'</div></div>';
  }).join("");
}

function buildHTML(){
  if(st.paso===PASO.ENVIANDO)return '<div class="card"><div class="loading"><div class="spinner"></div>Enviando...</div></div>';
  if(st.paso===PASO.EXITO){
    var f='<div class="r-fila"><span class="r-label">Distribuidora</span><span class="r-valor">'+st.distribuidora+'</span></div>';
    f+='<div class="r-fila"><span class="r-label">PDV</span><span class="r-valor mono">'+st.pdv+'</span></div>';
    f+='<div class="r-fila"><span class="r-label">Freezers Arcor</span><span class="r-valor">'+st.cantArcor+'</span></div>';
    if(st.sinFreezer)f+='<div class="r-fila"><span class="r-label">Sin freezer Arcor</span><span class="r-valor">SI</span></div>';
    seriesFlat().forEach(function(r){f+='<div class="r-fila"><span class="r-label">'+r.tipo+' #'+(r.idx+1)+'</span><span class="r-valor mono">'+r.val+'</span></div>';});
    return '<div class="card"><div class="header"><div class="logo">ARCOR</div><div class="titulo">Relevamiento de Freezers</div></div>'
      +'<div class="body"><div class="exito"><div class="exito-icon">&#10003;</div><h2 class="exito-titulo">Relevamiento enviado!</h2>'
      +'<div class="resumen-card">'+f+'</div>'
      +'<button class="btn-enviar" onclick="resetear()">Nuevo relevamiento</button></div></div></div>';
  }
  var navAnt=st.paso>PASO.DIST?'<button class="btn-secondary" id="btn-ant">&#8592; Anterior</button>':'<div></div>';
  var navSig=st.paso<PASO.RESUMEN?'<button class="btn-primary" id="btn-sig"'+(canSiguiente()?'':' disabled')+'>Siguiente &#8594;</button>':"";
  return '<div class="card">'
    +'<div class="header"><div class="logo">ARCOR</div><div class="titulo">Relevamiento de Freezers</div>'
    +'<div class="subtitulo">Region Centro &middot; '+new Date().toLocaleDateString("es-AR")+'</div>'
    +'<div class="progreso">'+buildProgreso()+'</div></div>'
    +'<div class="body"><div class="bloque">'+buildStep()+'</div></div>'
    +'<div class="nav">'+navAnt+navSig+'</div></div>';
}

function buildStep(){
  if(st.paso===PASO.DIST){
    var opts=DISTRIBUIDORAS.map(function(d){return '<option value="'+d+'"'+(d===st.distribuidora?' selected':'')+'>'+d+'</option>';}).join("");
    var s='<p class="ptitulo">1. Tu distribuidora</p><p class="hint">Selecciona tu distribuidora para continuar</p>'
      +'<select id="sel-dist"><option value="">-- Selecciona --</option>'+opts+'</select>';
    if(st.distribuidora)s+='<div class="seleccionado"><div class="sel-codigo">DISTRIBUIDORA CONFIRMADA</div><div class="sel-nombre">'+st.distribuidora+'</div><div class="sel-sub">'+pdvsDeDistribuidor().length+' puntos de venta asignados</div></div>';
    return s;
  }
  if(st.paso===PASO.PDV){
    var res=resultadosBusqueda();
    var dd="";
    if(st.dropdownVisible&&res.length>0)dd='<div class="dropdown">'+res.map(function(p){return '<div class="dd-item" data-pdv="'+p+'">'+p+'</div>';}).join("")+'</div>';
    else if(st.dropdownVisible&&st.pdvQuery.length>=3&&!st.pdv)dd='<div class="dropdown"><div class="dd-vacio">No se encontro ese codigo</div></div>';
    var s='<p class="ptitulo">2. Punto de Venta</p><p class="hint">Busca entre los <strong>'+pdvsDeDistribuidor().length+' PDV</strong> de tu distribuidora</p>'
      +'<div class="input-wrap"><input type="text" id="inp-pdv" placeholder="Ingresa parte del codigo..." value="'+st.pdvQuery+'" autocomplete="off">'
      +(st.pdv?'<span class="input-check">&#10003;</span>':"")
      +dd+'</div>';
    if(st.pdv)s+='<div class="seleccionado"><div class="sel-codigo">CODIGO CONFIRMADO</div><div class="sel-nombre" style="font-family:monospace;font-size:20px;letter-spacing:1px">'+st.pdv+'</div></div>';
    return s;
  }
  if(st.paso===PASO.FREEZER){
    var dis=st.sinFreezer?" style='opacity:.35;pointer-events:none'":"";
    var s='<p class="ptitulo">3. Freezers Arcor</p><p class="hint">Cuantos freezers Arcor hay en este PDV?</p>'
      +'<div class="cant-row"'+dis+'>'
      +'<button class="btn-cant" id="btn-menos"'+(st.cantArcor===0?' disabled':'')+'>&#8722;</button>'
      +'<div class="cant-num">'+st.cantArcor+'</div>'
      +'<button class="btn-cant" id="btn-mas">+</button>'
      +(st.cantArcor>0?'<span class="cant-label">freezer'+(st.cantArcor>1?'s':'')+'  Arcor</span>':"")
      +'</div>';
    if(st.cantArcor===0)s+='<div class="o-sep"><div class="o-linea"></div><span class="o-txt">o bien</span><div class="o-linea"></div></div>'
      +'<button class="btn-sin'+(st.sinFreezer?' activo':'')+'" id="btn-sin">'+(st.sinFreezer?'&#10003;  No tiene freezer Arcor':'No tiene freezer Arcor')+'</button>';
    if(st.cantArcor>0)s+='<div class="info-box">En el siguiente paso indicas cuantos son de cada tipo</div>';
    return s;
  }
  if(st.paso===PASO.TIPOS){
    var suma=sumaActual(),resto=st.cantArcor-suma;
    var color=resto===0?"#1a7f4b":resto<0?"#E31837":"#374151";
    var s='<p class="ptitulo">4. Tipos de freezer</p><p class="hint">Distribui los <strong>'+st.cantArcor+' freezer'+(st.cantArcor>1?'s':'')+'</strong> por tipo</p>'
      +'<div class="badge-asignar" style="color:'+color+'">'+(resto===0?'&#10003; Todos asignados':'Faltan asignar: '+resto)+'</div>';
    TIPOS_ARCOR.forEach(function(tipo){
      var cant=st.cantPorTipo[tipo]||0;
      s+='<div class="tipo-row'+(cant>0?' activo':'')+'">'
        +'<span class="tipo-nombre">'+tipo+'</span><div class="tipo-ctrl">'
        +'<button class="btn-tipo" data-tipo="'+tipo+'" data-delta="-1"'+(cant===0?' disabled':'')+'>&#8722;</button>'
        +'<span class="tipo-cant'+(cant>0?' activo':'')+'">'+cant+'</span>'
        +'<button class="btn-tipo" data-tipo="'+tipo+'" data-delta="1"'+(resto===0?' disabled':'')+'>+</button>'
        +'</div></div>';
    });
    return s;
  }
  if(st.paso===PASO.SERIES){
    var s='<p class="ptitulo">5. Numeros de Serie</p><p class="hint">Ingresa el numero de serie de cada freezer</p>';
    tiposUsados().forEach(function(tipo){
      var n=st.cantPorTipo[tipo];
      s+='<div style="margin-bottom:18px"><div class="serie-header">'+tipo+'</div>';
      for(var i=0;i<n;i++){var val=(st.seriesPorTipo[tipo]||[])[i]||"";s+='<div class="serie-row"><span class="serie-lbl">#'+(i+1)+'</span><input type="text" class="serie-input'+(val.length>=3?' ok':'')+'" data-tipo="'+tipo+'" data-idx="'+i+'" placeholder="Ej: ARC-2024-00123" value="'+val+'"></div>';}
      s+='</div>';
    });
    return s;
  }
  if(st.paso===PASO.RESUMEN){
    var f='<div class="r-fila"><span class="r-label">Distribuidora</span><span class="r-valor">'+st.distribuidora+'</span></div>';
    f+='<div class="r-fila"><span class="r-label">Punto de Venta</span><span class="r-valor mono">'+st.pdv+'</span></div>';
    f+='<div class="r-fila"><span class="r-label">Freezers Arcor</span><span class="r-valor">'+st.cantArcor+'</span></div>';
    if(st.sinFreezer)f+='<div class="r-fila"><span class="r-label">Sin freezer Arcor</span><span class="r-valor">SI</span></div>';
    tiposUsados().forEach(function(t){f+='<div class="r-fila"><span class="r-label">'+t+'</span><span class="r-valor">'+st.cantPorTipo[t]+'</span></div>';});
    seriesFlat().forEach(function(r){f+='<div class="r-fila"><span class="r-label">'+r.tipo+' #'+(r.idx+1)+'</span><span class="r-valor mono">'+r.val+'</span></div>';});
    return (st.error?'<div class="error-box">'+st.error+'</div>':"")
      +'<p class="ptitulo">Resumen del relevamiento</p><p class="hint">Revisa los datos antes de enviar</p>'
      +'<div class="resumen-card">'+f+'</div>'
      +'<button class="btn-enviar" id="btn-enviar">Enviar relevamiento &#8594;</button>';
  }
  return "";
}

function actualizarDropdown(){
  var wrap=document.querySelector(".input-wrap");
  if(!wrap) return;
  var dd=wrap.querySelector(".dropdown");
  if(dd) dd.parentNode.removeChild(dd);
  if(!st.dropdownVisible) return;
  var res=resultadosBusqueda();
  var html="";
  if(res.length>0){
    html='<div class="dropdown">'+res.map(function(p){return '<div class="dd-item" data-pdv="'+p+'">'+p+'</div>';}).join("")+'</div>';
  } else if(st.pdvQuery.length>=3&&!st.pdv){
    html='<div class="dropdown"><div class="dd-vacio">No se encontro ese codigo en tu distribuidora</div></div>';
  }
  if(html){
    wrap.insertAdjacentHTML("beforeend",html);
    wrap.querySelectorAll(".dd-item").forEach(function(d){
      d.addEventListener("pointerdown",function(e){
        e.preventDefault();
        st.pdv=d.dataset.pdv;
        st.pdvQuery=d.dataset.pdv;
        st.dropdownVisible=false;
        render();
      });
    });
  }
}

function attachEvents(){
  var el;
  el=document.getElementById("btn-sig");if(el)el.addEventListener("click",avanzar);
  el=document.getElementById("btn-ant");if(el)el.addEventListener("click",retroceder);
  el=document.getElementById("sel-dist");if(el)el.addEventListener("change",function(e){st.distribuidora=e.target.value;st.pdv=null;st.pdvQuery="";render();});
  el=document.getElementById("inp-pdv");
  if(el){
    el.addEventListener("input",function(e){
      st.pdvQuery=e.target.value;
      st.pdv=null;
      st.dropdownVisible=true;
      actualizarDropdown();
      var btnS=document.getElementById("btn-sig");
      if(btnS) btnS.disabled=!canSiguiente();
    });
    el.addEventListener("focus",function(){if(st.pdvQuery.length>=3){st.dropdownVisible=true;actualizarDropdown();}});
  }
  // dd-item handlers registrados en actualizarDropdown()
  document.addEventListener("pointerdown",function(e){
    if(!e.target.closest(".dropdown")&&!e.target.closest("#inp-pdv")&&st.dropdownVisible){st.dropdownVisible=false;render();}
  });
  el=document.getElementById("btn-mas");if(el)el.addEventListener("click",function(){st.cantArcor++;st.sinFreezer=false;st.cantPorTipo={};st.seriesPorTipo={};render();});
  el=document.getElementById("btn-menos");if(el)el.addEventListener("click",function(){if(st.cantArcor>0){st.cantArcor--;st.cantPorTipo={};st.seriesPorTipo={};render();}});
  el=document.getElementById("btn-sin");if(el)el.addEventListener("click",function(){st.sinFreezer=!st.sinFreezer;render();});
  document.querySelectorAll(".btn-tipo").forEach(function(b){
    b.addEventListener("click",function(){
      var tipo=b.dataset.tipo,delta=parseInt(b.dataset.delta),actual=st.cantPorTipo[tipo]||0,nuevo=actual+delta;
      if(nuevo<0)return;if(sumaActual()-actual+nuevo>st.cantArcor)return;
      st.cantPorTipo[tipo]=nuevo;
      if(delta<0){var arr=st.seriesPorTipo[tipo]||[];st.seriesPorTipo[tipo]=arr.slice(0,nuevo);}
      render();
    });
  });
  document.querySelectorAll(".serie-input").forEach(function(inp){
    inp.addEventListener("input",function(){
      var tipo=inp.dataset.tipo,idx=parseInt(inp.dataset.idx);
      if(!st.seriesPorTipo[tipo])st.seriesPorTipo[tipo]=[];
      st.seriesPorTipo[tipo][idx]=inp.value.toUpperCase();inp.value=inp.value.toUpperCase();
      inp.classList.toggle("ok",inp.value.length>=3);
      var s=document.getElementById("btn-sig");if(s)s.disabled=!canSiguiente();
    });
  });
  el=document.getElementById("btn-enviar");if(el)el.addEventListener("click",enviar);
}

function render(){
  try {
    document.getElementById("app").innerHTML=buildHTML();
    attachEvents();
  } catch(e) {
    document.getElementById("app").innerHTML='<div class="card"><div class="body"><div style="color:red;padding:20px;font-family:monospace;font-size:13px"><b>Error:</b><br>'+e.message+'<br><br>'+e.stack+'</div></div></div>';
  }
}
render();

</script>
